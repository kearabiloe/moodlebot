<!DOCTYPE html>
<html>
<head>
    <title>Cell Number Results</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <h1>Enter Cell Number</h1>
    <input type="text" id="cellno" placeholder="Enter cell number">
    <button onclick="fetchResults()">Submit</button>
    <div id="results"></div>

    <script>
        function fetchResults() {
            const cellno = $('#cellno').val();
            const url = `https://moodlebot.crowdcoin.co.za/results/${cellno}`;

            $.ajax({
                url: url,
                type: 'GET',
                success: (data) => {
                    const results = data.results.message.content;
                    $('#results').html(`<pre>${results}</pre>`);
                },
                error: (error) => {
                    console.error('Error fetching results:', error);
                    $('#results').html('An error occurred while fetching results.');
                }
            });
        }
    </script>
</body>
</html>
